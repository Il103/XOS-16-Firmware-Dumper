name: X6886 Dump to GitGud (DumprX ONLY + our stuff - no payload-dumper-go, no double download)

on:
  workflow_dispatch:
    inputs:
      FIRMWARE_LINK:
        description: OTA link
        required: false
        default: https://android.googleapis.com/packages/ota-api/package/837bf8fe0e8aba315b5972a23c78366bfa0744fc.zip
      BRANCH_NAME:
        description: GitLab branch
        required: false
        default: a16
      GITLAB_GROUP:
        description: GitGud group (leave EMPTY for your personal namespace - simplest)
        required: false
        default: ''
      PROJECT_NAME:
        description: Project name (empty = android_dump_infinix_x6886)
        required: false
        default: ''
      VISIBILITY:
        description: Visibility
        required: false
        default: public
        type: choice
        options: [public, private, internal]
      RUNNER:
        description: Self-hosted runner label. Put the exact label of your self-hosted runner. The workflow will automatically use it on your self-hosted runner. Leave empty to use GitHub-hosted ubuntu-latest.
        required: false
        default: 'self-hosted'

concurrency:
  group: x6886-dump
  cancel-in-progress: false

env:
  FIRMWARE_LINK: ${{ inputs.FIRMWARE_LINK }}
  BRANCH_INPUT: ${{ inputs.BRANCH_NAME }}
  GITLAB_GROUP: ${{ inputs.GITLAB_GROUP }}
  PROJECT_NAME_IN: ${{ inputs.PROJECT_NAME }}
  VISIBILITY: ${{ inputs.VISIBILITY }}
  GITLAB_TOKEN: ${{ secrets.GITGUD_TOKEN }}
  GITLAB_TOKEN_NAME: ${{ secrets.GITGUD_TOKEN_NAME }}
  BRAND: infinix
  CODENAME: x6886
  MODEL: Infinix Hot 60 Pro Plus
  BUILD_ID: BP2A.250605.031.A3
  FINGERPRINT: Infinix/X6886-OP/Infinix-X6886:16/BP2A.250605.031.A3/301400007:user/release-keys
  PLATFORM: mt6789
  ANDROID_VER: '16'
  KERNEL_VER: 6.12.38

jobs:
  dump:
    name: Dump X6886 by ${{ github.actor }}
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: github.event.repository.owner.id == github.event.sender.id
    timeout-minutes: 360
    # For self-hosted runners (any self-hosted - recommended for large dumps):
    # Set RUNNER input to your exact self-hosted runner label (it will use it automatically).
    # Self-hosted runners with big disk and fast CPU are perfect for full 8GB OTA dumps.
    # Leave RUNNER empty for normal GitHub-hosted (slower, may hit disk limits).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage 1 - Preflight (secrets + branch + project + device lock)
        run: |
          set -euo pipefail
          echo "::add-mask::${GITLAB_TOKEN}"
          [ -n "${GITLAB_TOKEN}" ] || { echo "::error::Secret GITGUD_TOKEN missing - create a PAT on gitgud.io (api + write_repository) and add it to repo secrets"; exit 1; }
          [ -n "${GITLAB_TOKEN_NAME}" ] || { echo "::error::Secret GITGUD_TOKEN_NAME missing - your gitgud.io username"; exit 1; }
          BN=$(printf '%s' "${BRANCH_INPUT}" | tr -d '[:space:]')
          [ -n "${BN}" ] || BN=a16
          echo "BRANCH_NAME=${BN}" >> "$GITHUB_ENV"
          GL_USER=$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitgud.io/api/v4/user" | jq -r '.username // empty')
          [ -n "${GL_USER}" ] || { echo "::error::GITGUD_TOKEN invalid - needs a gitgud.io PAT with api scope"; exit 1; }
          echo "GitLab user: ${GL_USER}"
          PROJECT="${PROJECT_NAME_IN}"
          [ -n "${PROJECT}" ] || PROJECT="android_dump_infinix_x6886"
          echo "PROJECT=${PROJECT}" >> "$GITHUB_ENV"
          echo "Device LOCKED from second zero: ${BRAND} ${CODENAME} (${MODEL}) - ${BUILD_ID}"
          echo "transsion/tssi can NEVER appear - hard-locked env vars, no build.prop guessing"
          echo "OTA link handled ENTIRELY by DumprX dumper.sh - no cache, no aria2, no payload-dumper-go, no double download"

      - name: Stage 2a - Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Stage 2b - Swap 12GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Stage 2c - Minimal tools ONLY (no payload-dumper-go, no aospdtgen, no aria2 - DumprX installs its own tools via setup.sh)
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq git-lfs cpio lz4 zstd > /dev/null 2>&1
          echo "Minimal tools ready (jq/git-lfs/cpio/lz4/zstd - for OUR additions only)"
          echo "DumprX setup.sh installs every extraction tool itself - nothing extra here"
          exit 0

      - name: Stage 3 - NO pre-download (DumprX dumper.sh downloads the OTA itself - no double download, no payload-dumper-go anywhere)
        run: |
          echo "Skipping our own download entirely - dumper.sh handles the OTA link directly"
          echo "This removes the old double-download (8GB by us + 8GB inside DumprX) that made runs take forever"
          exit 0

      - name: Stage 4 - (Skipped custom payload extraction - DumprX itself will handle download + payload + extraction as the core tool)
        run: |
          echo "DumprX will do the main extraction (dumper.sh handles OTA/payload/super/EROFS etc.)"
          echo "We only keep minimal prep here"
          mkdir -p workspace/extracted
          exit 0

      - name: Stage 5 - (Skipped custom super unpack - DumprX handles it)
        run: |
          echo "Letting DumprX do the heavy lifting for super and partitions"
          exit 0

      - name: Stage 6 - (Skipped custom partition extraction - DumprX dumper.sh is the main tool now)
        run: |
          echo "DumprX itself will extract the partitions. Our post-processing comes after."
          exit 0

      - name: Stage 7 - Our improved ramdisk extraction script (added on top of DumprX)
        run: |
          set +e
          cd workspace/extracted
          echo "=== Adding our ramdisk extraction script (on top of DumprX output) ==="
          for imgdir in boot vendor_boot init_boot; do
            for rd in $(find . -name "*ramdisk*" -type f 2>/dev/null | head -20); do
              [ -f "$rd" ] || continue
              name=$(basename "$rd")
              dest="ramdisks/${imgdir}_${name}_extracted"
              mkdir -p "$dest"
              sz=$(stat -c%s "$rd" 2>/dev/null || echo 0)
              [ "$sz" -lt 1000 ] && continue
              magic=$(xxd -p -l4 "$rd" 2>/dev/null | tr -d ' \n')
              case "$magic" in
                04224d18|02214c18) DEC="lz4 -dc" ;;
                1f8b*) DEC="gzip -dc" ;;
                28b52ffd) DEC="zstd -dc" ;;
                *) DEC="cat" ;;
              esac
              tmp=/tmp/rd.cpio
              rm -f "$tmp"
              for try in "$DEC" "lz4 -dc" "gzip -dc" "zstd -dc" "cat"; do
                if $try "$rd" > "$tmp" 2>/dev/null && [ "$(stat -c%s "$tmp" 2>/dev/null || echo 0)" -gt 1000 ]; then
                  ( cd "$dest" && cpio -idm --quiet < "$tmp" 2>/dev/null ) && echo "Extracted $name -> $dest" || echo "kept raw $name"
                  break
                fi
              done
              rm -f "$tmp"
            done
          done
          mkdir -p ramdisks
          echo "Our ramdisk script added (DumprX may have done some too)"
          exit 0

      - name: Stage 8 - Run DumprX itself (dumper.sh + setup.sh - LIVE output, NOTHING hidden, no tail)
        run: |
          set +e
          echo "=== Using DumprX ذات نفسو as the core (LIVE - everything visible) ==="
          git clone --depth=1 https://github.com/DumprX/DumprX.git || true
          cd DumprX
          echo "Running setup.sh (LIVE)..."
          bash setup.sh || true
          cd ..
          echo "Running dumper.sh on the OTA link (LIVE - you will see every download %, every partition being extracted, EVERYTHING)..."
          bash DumprX/dumper.sh "${FIRMWARE_LINK}" || echo "::warning::dumper.sh exited non-zero - still continuing to collect output"
          echo "=== DumprX run done ==="
          ls -la | head -40 || true
          mkdir -p workspace/extracted
          # DumprX output handling - move results to workspace/extracted
          for d in x6886* dump* out* extracted* firmware* DumprX*; do
            if [ -d "$d" ] && [ "$d" != "workspace" ]; then
              echo "Moving DumprX output $d ..."
              cp -r "$d"/* workspace/extracted/ 2>/dev/null || cp -r "$d" workspace/extracted/ || true
            fi
          done
          find . -maxdepth 3 -type f \( -name "*.img" -o -name "*.prop" -o -name "*ramdisk*" \) -exec cp {} workspace/extracted/ \; 2>/dev/null || true
          ls -la workspace/extracted/ | head -30 || true
          echo "DumprX core done - now adding our ramdisk script + full organization + GitGud push"
          exit 0

      - name: Stage 9 - Device info (hard-locked correct values + raw props evidence + README)
        run: |
          set -euo pipefail
          cd workspace/extracted
          {
            echo "Device: Infinix Hot 60 Pro Plus (X6886)"
            echo "Brand: infinix"
            echo "Codename: x6886"
            echo "Model: Infinix Hot 60 Pro Plus"
            echo "Build ID: BP2A.250605.031.A3"
            echo "Fingerprint: Infinix/X6886-OP/Infinix-X6886:16/BP2A.250605.031.A3/301400007:user/release-keys"
            echo "Platform: mt6789 | Android: 16 (XOS) | Kernel: 6.12.38"
            echo "A/B: true | Treble: true | Dynamic partitions: true | EROFS: true"
            echo ""
            echo "=== RAW build.prop evidence ==="
            for p in system/system/build.prop system/build.prop vendor/build.prop product/etc/build.prop odm/etc/build.prop system_ext/etc/build.prop; do
              if [ -f "$p" ]; then echo "--- $p ---"; head -60 "$p"; echo ""; fi
            done
          } > device-info.txt
          head -40 device-info.txt
          {
            echo "# Infinix Hot 60 Pro Plus (X6886) - Complete XOS 16 Dump"
            echo ""
            echo "- Brand: infinix | Codename: x6886"
            echo "- Build: BP2A.250605.031.A3 | Android 16"
            echo "- Platform: mt6789 | Kernel 6.12.38"
            echo ""
            echo "## Structure - ONE repo (GitGud - no 10GiB wall)"
            echo "- images/ - ALL 35 partition images + kernel + dtb (raw, real sizes)"
            echo "- system/ system_ext/ vendor/ product/ odm/ vendor_dlkm/ odm_dlkm/ system_dlkm/ tr_*/ - every partition fully extracted (real contents)"
            echo "- ramdisks/ - boot + vendor_boot + init_boot unpacked with every ramdisk extracted (magic-byte detection)"
            echo "- (aosp-device-tree/ will be generated LATER in separate workflow - as you asked)"
            echo "- device_info/ + proprietary-files-list.txt + complete_dump_manifest.txt"
          } > README.md

      - name: Stage 10 - Smart organize into ONE tree with MOVES (zero duplication, real sizes)
        run: |
          set +e
          cd workspace/extracted
          echo "=== SMART ORGANIZE - ONE repo, MOVE not copy (real sizes) ==="
          mkdir -p images ramdisks device_info
          echo "--- [1/5] ALL partition images -> images/ (one home for every img) ---"
          for f in *.img; do [ -f "$f" ] && mv -v "$f" images/ || true; done
          [ -f boot/kernel ] && cp boot/kernel images/kernel || true
          [ -f vendor_boot/kernel ] && cp vendor_boot/kernel images/vendor_boot_kernel || true
          [ -f boot/dtb ] && cp boot/dtb images/dtb || true
          [ -f vendor_boot/dtb ] && cp vendor_boot/dtb images/vendor_dtb || true
          find vendor_boot -name "*.dtb" -exec cp {} images/ \; 2>/dev/null || true
          echo "--- [2/5] boot folders -> ramdisks/ ---"
          for img in boot vendor_boot init_boot; do
            [ -d "$img" ] && mv -v "$img" ramdisks/ 2>/dev/null || true
          done
          echo "--- [3/5] device info + props ---"
          cp device-info.txt device_info/ 2>/dev/null || true
          find . -maxdepth 6 -name "*.prop" -not -path "./ramdisks/*" 2>/dev/null | while read -r f; do cp --parents "$f" device_info/ 2>/dev/null || true; done
          echo "--- [4/5] proprietary list (text - no duplicate copies) ---"
          find vendor vendor_dlkm odm odm_dlkm product system_ext -type f \( -name "*.so" -o -name "*.ko" -o -name "*.bin" -o -name "*.rc" \) 2>/dev/null | sort > proprietary-files-list.txt || true
          echo "--- [5/5] honest manifest (real sizes) ---"
          {
            echo "=== COMPLETE X6886 DUMP MANIFEST (ONE repo - zero duplication - real sizes) ==="
            echo "Device: Infinix Hot 60 Pro Plus (X6886) | Build BP2A.250605.031.A3 | Android 16"
            echo "Date: $(date -u)"
            echo ""
            for d in images ramdisks device_info system system_ext vendor product odm vendor_dlkm odm_dlkm system_dlkm tr_region tr_product tr_preload; do
              [ -d "$d" ] && echo "$d/: $(find "$d" -type f 2>/dev/null | wc -l) files, $(du -sh "$d" 2>/dev/null | cut -f1)"
            done
            echo ""
            echo "TOTAL FILES: $(find . -type f -not -path './.git/*' 2>/dev/null | wc -l)"
            echo "TOTAL SIZE: $(du -sh . 2>/dev/null | cut -f1)"
            echo ""
            echo "=== FULL FILE LIST ==="
            find . -type f -not -path './.git/*' | sort
          } > complete_dump_manifest.txt
          head -25 complete_dump_manifest.txt || true
          echo "Total size to push: $(du -sh . 2>/dev/null | cut -f1) (ONE repo - GitGud has no 10GiB wall)"
          exit 0

      - name: Stage 11 - Create/reuse the ONE GitGud project + force PUBLIC
        run: |
          set -euo pipefail
          NS_ARG=""
          if [ -n "${GITLAB_GROUP}" ]; then
            GENC=$(printf '%s' "${GITLAB_GROUP}" | jq -sRr @uri)
            NS_ID=$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitgud.io/api/v4/groups/${GENC}" | jq -r '.id // empty')
            [ -n "${NS_ID}" ] && NS_ARG="--data-urlencode namespace_id=${NS_ID}"
            [ -n "${NS_ID}" ] || echo "::notice::No group set - using your personal namespace on gitgud (simplest)"
          fi
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitgud.io/api/v4/projects" \
            --data-urlencode "name=${PROJECT}" --data-urlencode "path=${PROJECT}" \
            --data-urlencode "visibility=public" --data-urlencode "lfs_enabled=true" ${NS_ARG} > repo.json 2>/dev/null || true
          PID=$(jq -r '.id // empty' repo.json)
          SLUG=$(jq -r '.path_with_namespace // empty' repo.json)
          if [ -z "${SLUG}" ]; then
            PENC=$(printf '%s' "${PROJECT}" | jq -sRr @uri)
            curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitgud.io/api/v4/projects?membership=true&simple=true&per_page=100&search=${PENC}" > list.json 2>/dev/null || true
            PID=$(jq -r --arg p "${PROJECT}" '[.[] | select(.path==$p)][0].id // empty' list.json)
            SLUG=$(jq -r --arg p "${PROJECT}" '[.[] | select(.path==$p)][0].path_with_namespace // empty' list.json)
          fi
          [ -n "${SLUG}" ] && [ -n "${PID}" ] || { echo "::error::Could not create/find the GitGud project"; cat repo.json; exit 1; }
          PAPI="https://gitgud.io/api/v4/projects/${PID}"
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X PUT "${PAPI}" --data-urlencode "visibility=public" --data-urlencode "lfs_enabled=true" > vis.json 2>/dev/null || true
          VIS=$(jq -r '.visibility' vis.json 2>/dev/null || echo unknown)
          echo "Visibility: ${VIS:-unknown}"
          BENC=$(printf '%s' "${BRANCH_NAME}" | jq -sRr @uri)
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X DELETE "${PAPI}/protected_branches/${BENC}" > /dev/null 2>&1 || true
          echo "GITLAB_SLUG=${SLUG}" >> "$GITHUB_ENV"
          echo "GITLAB_PID=${PID}" >> "$GITHUB_ENV"
          echo "Project ready: https://gitgud.io/${SLUG} (id ${PID})"

      - name: Stage 12 - Push EVERYTHING to the ONE GitGud repo (disk-smart split commits, aggressive LFS, HONEST result)
        run: |
          set +e
          cd workspace/extracted
          df -h "$PWD" | tail -1
          rm -rf .git .gitattributes .gitignore
          git init -q -b "${BRANCH_NAME}"
          git lfs install --local
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config http.postBuffer 2097152000
          git config http.version HTTP/1.1
          git config core.compression 9
          git config pack.threads 0
          git config index.threads 0
          git config gc.auto 0
          git config lfs.concurrenttransfers 16
          TOTAL=$(find . -type f -not -path './.git/*' 2>/dev/null | wc -l)
          SIZE=$(du -sh --exclude=.git . 2>/dev/null | cut -f1)
          # Aggressive LFS - every heavy/binary type via LFS (per-object uploads, proven 158MB/s here) so the plain git pack stays small
          git lfs track "*.img" "*.so" "*.apk" "*.apex" "*.bin" "*.dat" "*.ko" "*.vdex" "*.odex" "*.art" "*.arsc" "*.pak" "*.ttf" "*.otf" "*.jar" "*.zip" "*.gz" "*.zst" "*.br" "*.xz" "*.lz4" "*.cpio" "*.dtb" "*.fw" "*.elf" "*.ogg" "*.wav" "*.mp3" "*.mp4" "*.pb" "*.tflite" "*.webp" > /dev/null 2>&1 || true
          find . -type f -size +50M -not -path "./.git/*" -print0 2>/dev/null | xargs -0 -r git lfs track > /dev/null 2>&1 || true
          [ -f .gitattributes ] && git add .gitattributes
          git remote add origin "https://${GITLAB_TOKEN_NAME}:${GITLAB_TOKEN}@gitgud.io/${GITLAB_SLUG}.git"
          # DISK-SMART: commit in 3 parts, deleting each part from the WORKING TREE after its commit.
          # git push reads objects from .git only - working-tree files are NOT needed at push time.
          # Peak disk drops from ~60GB (26G tree + 26G .git + 8G zip) to ~40GB - no more "no space left on device".
          echo "=== Commit 1/3: raw partition images (images/) ==="
          if git add images/ && git commit -qsm "x6886: all 35 raw partition images (real sizes)"; then
            rm -rf images
            echo "images/ safe in .git - working copy deleted, disk freed"
          else
            echo "::warning::images/ commit had an issue - kept on disk"
          fi
          echo "=== Commit 2/3: extracted tr_* partitions ==="
          TR_ADDED=0
          for d in tr_region tr_product tr_preload tr_carrier tr_company tr_manifest tr_misc tr_overlayfs; do
            if [ -d "$d" ] && [ -n "$(find "$d" -type f -print -quit 2>/dev/null)" ]; then
              git add "$d" && TR_ADDED=1
            fi
          done
          if [ "${TR_ADDED}" = "1" ] && git commit -qsm "x6886: extracted tr_* partition contents"; then
            rm -rf tr_region tr_product tr_preload tr_carrier tr_company tr_manifest tr_misc tr_overlayfs
            echo "tr_* safe in .git - working copies deleted, disk freed"
          else
            echo "::notice::no tr_* content committed - nothing to free"
          fi
          echo "=== Commit 3/3: everything else (extracted partitions + ramdisks + device tree + docs) ==="
          EXC=()
          [ -n "$(git ls-files -- images/ 2>/dev/null | head -1)" ] && EXC+=( ':(exclude)images' )
          for d in tr_region tr_product tr_preload tr_carrier tr_company tr_manifest tr_misc tr_overlayfs; do
            [ -n "$(git ls-files -- "$d" 2>/dev/null | head -1)" ] && EXC+=( ":(exclude)$d" )
          done
          git add -A -- . "${EXC[@]}"
          git commit -qsm "x6886: extracted partitions + ramdisks + auto device tree + manifest - ${BUILD_ID}" || true
          REPO_FILES=$(git ls-files 2>/dev/null | wc -l)
          REPO_IMGS=$(git ls-files -- images/ 2>/dev/null | wc -l)
          echo "Repo holds ${REPO_FILES} tracked files (${REPO_IMGS} raw images) in 3 commits"
          [ "${REPO_IMGS}" -ge 30 ] || echo "::warning::images/ count in repo is low (${REPO_IMGS}) - check the log above"
          echo "Pushing ${TOTAL} files (${SIZE}) to https://gitgud.io/${GITLAB_SLUG} branch ${BRANCH_NAME} ..."
          rc=1
          for i in 1 2 3; do
            if git push --force -u origin "${BRANCH_NAME}"; then rc=0; break; fi
            echo "::warning::push attempt ${i} failed - retrying in 30s"
            sleep 30
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Push FAILED after 3 attempts - honest failure, nothing was uploaded"
            echo "RESULT=FAILED" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "RESULT=OK" >> "$GITHUB_ENV"
          PAPI="https://gitgud.io/api/v4/projects/${GITLAB_PID}"
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X PUT "${PAPI}" \
            --data-urlencode "default_branch=${BRANCH_NAME}" \
            --data-urlencode "description=Complete XOS 16 dump - Infinix Hot 60 Pro Plus (X6886) - ${BUILD_ID} - ONE repo: all raw images (images/) + every partition extracted (real sizes) + ramdisks + auto device tree + full manifest" \
            --data-urlencode "topics=infinix,x6886,android16,firmware,dump,mt6789" > /dev/null 2>&1 || true
          echo "PUSHED OK - https://gitgud.io/${GITLAB_SLUG} branch ${BRANCH_NAME} (${TOTAL} files, ${SIZE}) - honest success"

      - name: Job summary
        if: always()
        run: |
          cd workspace/extracted 2>/dev/null || true
          {
            echo "### X6886 Complete Dump - Infinix Hot 60 Pro Plus (ONE repo on GitGud)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Brand | infinix |"
            echo "| Codename | x6886 |"
            echo "| Model | Infinix Hot 60 Pro Plus |"
            echo "| Build | BP2A.250605.031.A3 |"
            echo "| Branch | ${BRANCH_NAME} |"
            echo "| Total files (tracked in the repo) | $(git ls-files 2>/dev/null | wc -l) |"
            echo "| Result | ${RESULT:-did not reach push} |"
            echo "| GitGud | https://gitgud.io/${GITLAB_SLUG:-} |"
          } >> "$GITHUB_STEP_SUMMARY"
