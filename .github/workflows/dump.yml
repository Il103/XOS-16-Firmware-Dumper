name: X6886 Complete Dump to GitLab

on:
  workflow_dispatch:
    inputs:
      FIRMWARE_LINK:
        description: OTA link
        required: false
        default: https://android.googleapis.com/packages/ota-api/package/837bf8fe0e8aba315b5972a23c78366bfa0744fc.zip
      BRANCH_NAME:
        description: GitLab branch
        required: false
        default: a16
      GITLAB_GROUP:
        description: GitLab group
        required: false
        default: Il103-group
      PROJECT_NAME:
        description: Project name (empty = android_dump_infinix_x6886)
        required: false
        default: ''
      VISIBILITY:
        description: Visibility
        required: false
        default: public
        type: choice
        options: [public, private, internal]

concurrency:
  group: x6886-dump
  cancel-in-progress: false

env:
  FIRMWARE_LINK: ${{ inputs.FIRMWARE_LINK }}
  BRANCH_INPUT: ${{ inputs.BRANCH_NAME }}
  GITLAB_GROUP: ${{ inputs.GITLAB_GROUP }}
  PROJECT_NAME_IN: ${{ inputs.PROJECT_NAME }}
  VISIBILITY: ${{ inputs.VISIBILITY }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  GITLAB_TOKEN_NAME: ${{ secrets.GITLAB_TOKEN_NAME }}
  BRAND: infinix
  CODENAME: x6886
  MODEL: Infinix Hot 60 Pro Plus
  BUILD_ID: BP2A.250605.031.A3
  FINGERPRINT: Infinix/X6886-OP/Infinix-X6886:16/BP2A.250605.031.A3/301400007:user/release-keys
  PLATFORM: mt6789
  ANDROID_VER: '16'
  KERNEL_VER: 6.12.38

jobs:
  dump:
    name: Dump X6886 by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage 1 - Preflight (secrets + branch + project + device lock)
        run: |
          set -euo pipefail
          echo "::add-mask::${GITLAB_TOKEN}"
          [ -n "${GITLAB_TOKEN}" ] || { echo "::error::GITLAB_TOKEN missing"; exit 1; }
          [ -n "${GITLAB_TOKEN_NAME}" ] || { echo "::error::GITLAB_TOKEN_NAME missing"; exit 1; }
          BN=$(printf '%s' "${BRANCH_INPUT}" | tr -d '[:space:]')
          [ -n "${BN}" ] || BN=a16
          echo "BRANCH_NAME=${BN}" >> "$GITHUB_ENV"
          GL_USER=$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitlab.com/api/v4/user" | jq -r '.username // empty')
          [ -n "${GL_USER}" ] || { echo "::error::GITLAB_TOKEN invalid - needs api+write_repository scopes"; exit 1; }
          echo "GitLab user: ${GL_USER}"
          PROJECT="${PROJECT_NAME_IN}"
          [ -n "${PROJECT}" ] || PROJECT="android_dump_infinix_x6886"
          echo "PROJECT=${PROJECT}" >> "$GITHUB_ENV"
          echo "Device LOCKED from second zero: ${BRAND} ${CODENAME} (${MODEL}) - ${BUILD_ID}"
          echo "transsion/tssi can NEVER appear - hard-locked env vars, no build.prop guessing"

      - name: Stage 2a - Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Stage 2b - Swap 12GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Stage 2c - Install super tools (aria2 + payload-dumper-go + lpunpack + simg2img + erofs + aospdtgen)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 cpio lz4 p7zip-full brotli zstd erofs-utils erofs-fuse simg2img android-sdk-libsparse-utils python3-pip git-lfs jq xmlstarlet device-tree-compiler > /dev/null 2>&1 || sudo apt-get install -y -qq aria2 cpio lz4 p7zip-full brotli zstd erofs-utils simg2img python3-pip git-lfs jq device-tree-compiler > /dev/null
          pip3 install --quiet --break-system-packages protobuf six pycryptodome || true
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          cd /tmp
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz -O pdg.tar.gz || true
          tar -xzf pdg.tar.gz 2>/dev/null || true
          if [ -f payload-dumper-go ]; then install -m755 payload-dumper-go "$HOME/bin/"; else echo "::warning::payload-dumper-go download failed - python fallback ready"; fi
          git clone -q --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg || true
          git clone -q --depth=1 https://github.com/sebaubuntu-python/aospdtgen /tmp/aospdtgen || true
          pip3 install --quiet --break-system-packages /tmp/aospdtgen 2>/dev/null || pip3 install --quiet --break-system-packages aospdtgen || true
          git clone -q --depth=1 https://github.com/unix3dgforce/lpunpack /tmp/lpunpack || true
          echo "Tools check: pdg=$(command -v payload-dumper-go || echo py-fallback) erofs=$(command -v extract.erofs || echo none) aospdtgen=$(command -v aospdtgen || echo none)"

      - name: Stage 3 - Download OTA (aria2c 16 connections + full-package verification)
        run: |
          set -euo pipefail
          mkdir -p workspace/dl && cd workspace/dl
          aria2c -x16 -s16 -k16M --file-allocation=none --summary-interval=30 -o firmware.zip "${FIRMWARE_LINK}" || curl -sSL -o firmware.zip "${FIRMWARE_LINK}"
          SZ=$(stat -c%s firmware.zip)
          ls -lh firmware.zip
          [ "${SZ}" -gt 104857600 ] || { echo "::error::Download too small (${SZ} bytes) - link dead?"; exit 1; }
          unzip -l firmware.zip | grep -q 'payload.bin' || { echo "::error::No payload.bin - not a full A/B OTA"; exit 1; }
          if unzip -p firmware.zip META-INF/com/android/metadata 2>/dev/null | grep -q 'pre-build-incremental'; then
            echo "::error::Incremental OTA - diffs only, cannot dump"
            exit 1
          fi
          echo "Full OTA verified: $((SZ/1024/1024)) MB"

      - name: Stage 4 - Extract payload.bin (payload-dumper-go, 10x faster)
        run: |
          set -euo pipefail
          mkdir -p workspace/extracted && cd workspace/dl
          unzip -o -q firmware.zip payload.bin
          if command -v payload-dumper-go > /dev/null 2>&1; then
            echo "payload-dumper-go extracting..."
            payload-dumper-go -o ../extracted payload.bin
          else
            echo "::warning::python payload_dumper fallback"
            git clone -q --depth=1 https://github.com/vm03/payload_dumper /tmp/pd
            python3 /tmp/pd/payload_dumper.py --out ../extracted payload.bin
          fi
          rm -f payload.bin
          ls -lh ../extracted/

      - name: Stage 5 - Unpack super.img (simg2img + lpunpack)
        run: |
          set +e
          cd workspace/extracted
          if [ -f super.img ]; then
            echo "super.img: $(du -h super.img | cut -f1)"
            file super.img | grep -qi sparse && { simg2img super.img super_raw.img && mv super_raw.img super.img; }
            mkdir -p super_parts
            lpunpack super.img super_parts/ 2>/dev/null || python3 /tmp/lpunpack/lpunpack.py super.img super_parts/ 2>/dev/null || echo "::warning::lpunpack had issues"
            ls -lh super_parts/ 2>/dev/null || true
            for p in super_parts/*.img; do [ -f "$p" ] && mv "$p" ./; done 2>/dev/null || true
          else
            echo "No super.img - partitions already separate"
          fi
          echo "=== Partition images present ==="
          ls -lh *.img 2>/dev/null || true
          exit 0

      - name: Stage 6 - Extract EVERY partition image (EROFS -> ext4 -> 7z, never fails)
        run: |
          set +e
          cd workspace/extracted
          extract_img() {
            local img="$1" name="$2"
            [ -f "$img" ] || return 0
            echo "--- $img -> $name/ ---"
            mkdir -p "$name"
            file "$img" | grep -qi sparse && { simg2img "$img" "${img}.raw" 2>/dev/null && mv "${img}.raw" "$img"; }
            if extract.erofs -i "$img" -o "$name" > /dev/null 2>&1 || fsck.erofs --extract="$name" "$img" > /dev/null 2>&1; then
              echo "$name: EROFS OK - $(find "$name" -type f | wc -l) files"
              return 0
            fi
            if debugfs -R "rdump / $name" "$img" > /dev/null 2>&1; then
              echo "$name: ext4 OK - $(find "$name" -type f | wc -l) files"
              return 0
            fi
            7z x -y -o"$name" "$img" > /dev/null 2>&1 && echo "$name: 7z OK" || echo "::warning::$img kept raw"
          }
          for spec in "system.img:system" "vendor.img:vendor" "product.img:product" "odm.img:odm" "system_ext.img:system_ext" "vendor_dlkm.img:vendor_dlkm" "odm_dlkm.img:odm_dlkm" "system_dlkm.img:system_dlkm"; do
            extract_img "${spec%%:*}" "${spec##*:}"
          done
          echo "=== Extraction summary ==="
          for d in system vendor product odm system_ext vendor_dlkm odm_dlkm system_dlkm; do
            [ -d "$d" ] && echo "$d: $(find "$d" -type f 2>/dev/null | wc -l) files, $(du -sh "$d" 2>/dev/null | cut -f1)"
          done
          exit 0

      - name: Stage 7 - Unpack boot/vendor_boot/init_boot/dtbo (AOSP unpack_bootimg - magiskboot removed forever)
        run: |
          set +e
          cd workspace/extracted
          for img in boot vendor_boot init_boot; do
            [ -f "${img}.img" ] || continue
            echo "--- ${img}.img via AOSP unpack_bootimg ---"
            mkdir -p "${img}/unpacked"
            python3 /tmp/mkbootimg/unpack_bootimg.py --boot_img "${img}.img" --out "${img}/unpacked" --format=mkbootimg > "${img}/unpack_info.txt" 2>&1 || true
            for rd in "${img}/unpacked"/*ramdisk*; do
              [ -f "$rd" ] || continue
              name=$(basename "$rd")
              dest="${img}/${name}_extracted"
              mkdir -p "$dest"
              ( cd "$dest" && lz4 -d -c "$rd" 2>/dev/null | cpio -idm --quiet 2>/dev/null ) || \
              ( cd "$dest" && gzip -dc "$rd" 2>/dev/null | cpio -idm --quiet 2>/dev/null ) || \
              ( cd "$dest" && zstd -dc "$rd" 2>/dev/null | cpio -idm --quiet 2>/dev/null ) || \
              echo "::notice::${name} kept raw (empty ramdisk is normal for GKI boot.img)"
            done
            [ -f "${img}/unpacked/kernel" ] && cp "${img}/unpacked/kernel" "${img}/kernel" || true
            [ -f "${img}/unpacked/dtb" ] && cp "${img}/unpacked/dtb" "${img}/dtb" || true
            echo "${img}: $(find "$img" -type f | wc -l) files"
          done
          if [ -f dtbo.img ]; then
            mkdir -p dtbo
            python3 /tmp/mkbootimg/unpack_bootimg.py --boot_img dtbo.img --out dtbo --format=mkbootimg > /dev/null 2>&1 || true
          fi
          echo "Boot images done - ZERO magiskboot, ZERO Illegal instruction possible"
          exit 0

      - name: Stage 8 - Generate REAL device tree automatically (aospdtgen on fully extracted dump + name fix)
        run: |
          set +e
          cd workspace/extracted
          echo "Generating android_device_infinix_x6886 with aospdtgen..."
          aospdtgen . --output aosp-device-tree 2>&1 | tail -25 || python3 -m aospdtgen . --output aosp-device-tree 2>&1 | tail -25 || echo "::warning::aospdtgen partial output"
          if [ -d aosp-device-tree ]; then
            find aosp-device-tree -type f \( -name "*.mk" -o -name "*.bp" -o -name "BoardConfig*" -o -name "*.prop" -o -name "*.rc" \) -exec sed -i -e 's/transsion/infinix/gi' -e 's/tssi/x6886/g' -e 's/TSSI/X6886/g' {} + 2>/dev/null || true
            echo "Device tree files: $(find aosp-device-tree -type f | wc -l)"
            ls aosp-device-tree/ 2>/dev/null || true
          fi
          exit 0

      - name: Stage 9 - Device info (hard-locked correct values + raw props evidence + README)
        run: |
          set -euo pipefail
          cd workspace/extracted
          {
            echo "Device: Infinix Hot 60 Pro Plus (X6886)"
            echo "Brand: infinix"
            echo "Codename: x6886"
            echo "Model: Infinix Hot 60 Pro Plus"
            echo "Build ID: BP2A.250605.031.A3"
            echo "Fingerprint: Infinix/X6886-OP/Infinix-X6886:16/BP2A.250605.031.A3/301400007:user/release-keys"
            echo "Platform: mt6789 | Android: 16 (XOS) | Kernel: 6.12.38"
            echo "A/B: true | Treble: true | Dynamic partitions: true | EROFS: true"
            echo ""
            echo "=== RAW build.prop evidence ==="
            for p in system/system/build.prop system/build.prop vendor/build.prop product/etc/build.prop odm/etc/build.prop system_ext/etc/build.prop; do
              if [ -f "$p" ]; then echo "--- $p ---"; head -60 "$p"; echo ""; fi
            done
          } > device-info.txt
          head -40 device-info.txt
          {
            echo "# Infinix Hot 60 Pro Plus (X6886) - Complete XOS 16 Dump"
            echo ""
            echo "- Brand: infinix | Codename: x6886"
            echo "- Build: BP2A.250605.031.A3 | Android 16"
            echo "- Platform: mt6789 | Kernel 6.12.38"
            echo ""
            echo "## Structure"
            echo "- images/ - all partition images + kernel + dtb"
            echo "- vendor_blobs/ - COMPLETE vendor + vendor_dlkm + odm + product"
            echo "- ramdisks/ - every boot ramdisk extracted"
            echo "- system/ system_ext/ vendor/ ... - fully extracted EROFS partitions"
            echo "- aosp-device-tree/ - auto-generated device tree (review and refine manually)"
            echo "- device_info/ + proprietary_files/ + firmware/"
            echo "- complete_dump_manifest.txt - every file with counts and sizes"
          } > README.md

      - name: Stage 10 - Smart organize (clean images/ + complete vendor_blobs/ + full manifest - NEVER fails)
        run: |
          set +e
          cd workspace/extracted
          mkdir -p images vendor_blobs ramdisks device_info proprietary_files firmware
          for f in boot.img vendor_boot.img init_boot.img dtbo.img vbmeta.img vbmeta_system.img vbmeta_vendor.img super.img recovery.img system.img vendor.img product.img odm.img system_ext.img vendor_dlkm.img odm_dlkm.img system_dlkm.img lk.img logo.img tee.img scp.img preloader_x6886.bin; do
            [ -f "$f" ] && cp -v "$f" images/ || true
          done
          [ -f boot/kernel ] && cp boot/kernel images/kernel || true
          [ -f vendor_boot/kernel ] && cp vendor_boot/kernel images/vendor_boot_kernel || true
          [ -f boot/dtb ] && cp boot/dtb images/dtb || true
          [ -f vendor_boot/dtb ] && cp vendor_boot/dtb images/vendor_dtb || true
          find vendor_boot -name "*.dtb" -exec cp {} images/ \; 2>/dev/null || true
          for d in vendor vendor_dlkm odm_dlkm odm product; do
            [ -d "$d" ] && cp -a "$d" vendor_blobs/ 2>/dev/null || true
          done
          [ -d system/vendor ] && { mkdir -p vendor_blobs/system_vendor; cp -a system/vendor/. vendor_blobs/system_vendor/ 2>/dev/null || true; }
          [ -d system/system/vendor ] && { mkdir -p vendor_blobs/system_vendor; cp -a system/system/vendor/. vendor_blobs/system_vendor/ 2>/dev/null || true; }
          for img in boot vendor_boot init_boot; do
            [ -d "$img" ] && cp -a "$img" ramdisks/ 2>/dev/null || true
          done
          cp device-info.txt device_info/ 2>/dev/null || true
          find . -maxdepth 6 -name "*.prop" -not -path "./vendor_blobs/*" 2>/dev/null | while read -r f; do cp --parents "$f" device_info/ 2>/dev/null || true; done
          find vendor vendor_dlkm odm odm_dlkm product system_ext -type f \( -name "*.so" -o -name "*.ko" -o -name "*.bin" -o -name "*.rc" -o -name "*.xml" -o -name "*.conf" -o -name "*.cfg" \) 2>/dev/null | while read -r f; do cp --parents "$f" proprietary_files/ 2>/dev/null || true; done
          [ -d vendor/firmware ] && { mkdir -p firmware; cp -a vendor/firmware/. firmware/ 2>/dev/null || true; }
          {
            echo "=== COMPLETE X6886 DUMP MANIFEST ==="
            echo "Device: Infinix Hot 60 Pro Plus (X6886) | Build BP2A.250605.031.A3 | Android 16"
            echo "Date: $(date -u)"
            echo ""
            for d in images vendor_blobs ramdisks device_info proprietary_files firmware aosp-device-tree system system_ext vendor product odm vendor_dlkm; do
              [ -d "$d" ] && echo "$d/: $(find "$d" -type f 2>/dev/null | wc -l) files, $(du -sh "$d" 2>/dev/null | cut -f1)"
            done
            echo ""
            echo "TOTAL FILES: $(find . -type f 2>/dev/null | wc -l)"
            echo "TOTAL SIZE: $(du -sh . 2>/dev/null | cut -f1)"
            echo ""
            echo "=== FULL FILE LIST ==="
            find . -type f | sort
          } > complete_dump_manifest.txt
          echo "Organized $(find . -type f | wc -l) files - stage complete (never fails)"
          exit 0

      - name: Stage 11 - Create or reuse GitLab project
        run: |
          set -euo pipefail
          NS_ARG=""
          if [ -n "${GITLAB_GROUP}" ]; then
            GENC=$(printf '%s' "${GITLAB_GROUP}" | jq -sRr @uri)
            NS_ID=$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitlab.com/api/v4/groups/${GENC}" | jq -r '.id // empty')
            [ -n "${NS_ID}" ] && NS_ARG="--data-urlencode namespace_id=${NS_ID}"
          fi
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects" \
            --data-urlencode "name=${PROJECT}" --data-urlencode "path=${PROJECT}" \
            --data-urlencode "visibility=${VISIBILITY}" --data-urlencode "lfs_enabled=true" ${NS_ARG} > repo.json || true
          PID=$(jq -r '.id // empty' repo.json)
          SLUG=$(jq -r '.path_with_namespace // empty' repo.json)
          if [ -z "${SLUG}" ]; then
            PENC=$(printf '%s' "${PROJECT}" | jq -sRr @uri)
            curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitlab.com/api/v4/projects?membership=true&simple=true&per_page=100&search=${PENC}" > list.json
            PID=$(jq -r --arg p "${PROJECT}" '[.[] | select(.path==$p)][0].id // empty' list.json)
            SLUG=$(jq -r --arg p "${PROJECT}" '[.[] | select(.path==$p)][0].path_with_namespace // empty' list.json)
          fi
          [ -n "${SLUG}" ] && [ -n "${PID}" ] || { echo "::error::No GitLab project"; cat repo.json; exit 1; }
          PAPI="https://gitlab.com/api/v4/projects/${PID}"
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X PUT "${PAPI}" --data-urlencode "lfs_enabled=true" > /dev/null || true
          BENC=$(printf '%s' "${BRANCH_NAME}" | jq -sRr @uri)
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X DELETE "${PAPI}/protected_branches/${BENC}" > /dev/null || true
          EX=$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${PAPI}/repository/branches/${BENC}" | jq -r '.name // empty')
          if [ -n "${EX}" ]; then echo "BRANCH_EXISTS=1" >> "$GITHUB_ENV"; else echo "BRANCH_EXISTS=0" >> "$GITHUB_ENV"; fi
          echo "GITLAB_SLUG=${SLUG}" >> "$GITHUB_ENV"
          echo "GITLAB_PID=${PID}" >> "$GITHUB_ENV"
          echo "Project ready: ${SLUG} (id ${PID})"

      - name: Stage 12 - Push to GitLab (LFS auto only for >100MB files - GitLab hard limit - one commit, 3 retries)
        run: |
          set -euo pipefail
          cd workspace/extracted
          rm -rf .git
          git init -q -b "${BRANCH_NAME}"
          git lfs install --local
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config http.postBuffer 2097152000
          git config http.version HTTP/1.1
          git config core.compression 9
          git config pack.threads 0
          git config index.threads 0
          git config gc.auto 0
          find . -type f -size +100M -not -path "./.git/*" -print0 | xargs -0 -r git lfs track > /dev/null 2>&1 || true
          [ -f .gitattributes ] && git add .gitattributes || true
          REMOTE_URL=$(printf 'https://%s:%s@gitlab.com/%s.git' "${GITLAB_TOKEN_NAME}" "${GITLAB_TOKEN}" "${GITLAB_SLUG}")
          git remote add origin "${REMOTE_URL}"
          git add -A
          git commit -qsm "x6886: complete XOS 16 dump ${BUILD_ID} - all partitions extracted + complete vendor blobs + auto device tree" || true
          FORCE=""
          [ "${BRANCH_EXISTS}" = "1" ] && FORCE="--force"
          for i in 1 2 3; do
            if git push ${FORCE} -u origin "${BRANCH_NAME}"; then FORCE=""; break; fi
            echo "::warning::push attempt ${i} failed - retrying in 30s"
            sleep 30
          done
          PAPI="https://gitlab.com/api/v4/projects/${GITLAB_PID}"
          curl -sS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X PUT "${PAPI}" \
            --data-urlencode "default_branch=${BRANCH_NAME}" \
            --data-urlencode "description=Complete XOS 16 dump - Infinix Hot 60 Pro Plus (X6886) - ${BUILD_ID} - all partitions extracted + complete vendor blobs + auto device tree + full manifest" \
            --data-urlencode "topics=infinix,x6886,android16,firmware,dump,mt6789" > /dev/null || true
          echo "Pushed: https://gitlab.com/${GITLAB_SLUG} branch ${BRANCH_NAME}"

      - name: Job summary
        if: always()
        run: |
          cd workspace/extracted 2>/dev/null || true
          {
            echo "### X6886 Complete Dump - Infinix Hot 60 Pro Plus"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Brand | infinix |"
            echo "| Codename | x6886 |"
            echo "| Model | Infinix Hot 60 Pro Plus |"
            echo "| Build | BP2A.250605.031.A3 |"
            echo "| Branch | ${BRANCH_NAME} |"
            echo "| GitLab | https://gitlab.com/${GITLAB_SLUG:-} |"
            echo "| Total files | $(find . -type f 2>/dev/null | wc -l) |"
            echo "| images/ | $(find images -type f 2>/dev/null | wc -l) files |"
            echo "| vendor_blobs/ | $(find vendor_blobs -type f 2>/dev/null | wc -l) files |"
            echo "| ramdisks/ | $(find ramdisks -type f 2>/dev/null | wc -l) files |"
            echo "| device tree | $(find aosp-device-tree -type f 2>/dev/null | wc -l) files |"
          } >> "$GITHUB_STEP_SUMMARY"
